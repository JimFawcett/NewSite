<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benefits - AI Presentation 2026</title>
  <link rel="stylesheet" href="../Learn/css/reset.css">
  <link rel="stylesheet" href="../Learn/css/ThemeOcean2.css">
  <link rel="stylesheet" href="../css/prism.css">
  <link rel="stylesheet" href="../Learn/css/Learn.css">
  <style>
    tm-b {
      display:block;
      margin: 1rem 0rem 0.5rem 0rem;
    }
    tm-b.note {
      border:2px dashed red;
      padding:0.5rem 1.5rem;
      margin: 0.75rem 0rem;
    }
    tm-b ul.tight {
      margin:0rem 1rem;
    }
    tm-b ul.tight li {
      margin:0rem 0.5rem 0.25rem 0.5rem;
    }
    #lang-bar a {
      font-size: 0.75rem;
    }
    #sections-wrap #sections-dropdown,
    #pages-wrap #pages-dropdown {
      top: 100%;          /* no dead gap: the pointer stays inside the wrap on its way down */
      padding-top: 0.7em;
    }
  </style>
</head>
<body>

<div id="top-controls">
  <a id="site-btn" href="../Site/Explore.html?src=SiteHome.html">Site</a>
  <div id="sections-wrap">
    <button id="sections-btn" type="button">Sections</button>
    <div id="sections-dropdown"></div>
  </div>
  <div id="pages-wrap">
    <button id="pages-btn" type="button">Pages</button>
    <div id="pages-dropdown"></div>
  </div>
</div>

<header>
  <h1>Benefits - AI Presentation 2026</h1>
  <t-b>What the models return, to one person and to a population</t-b>
</header>

<nav id="lang-bar">
  <div id="lang-links">
    <a href="Introduction.html">Introduction</a>
    <a href="../Learn/Learn_intro.html">Tutorials</a>
  </div>
  <div id="lang-nav">
    <a id="fs-btn" href="#">Full Screen</a>
  </div>
</nav>

<main id="content">

</main>

<footer id="page-bottom">
  AI Presentation 2026 &nbsp;&bull;&nbsp; Benefits
</footer>

  <script src="../js/prism.js"></script>
  <script src="PresentationPages.js"></script>
  <script>
    const sectionsBtn = document.getElementById('sections-btn');
    const sectionsDropdown = document.getElementById('sections-dropdown');
    { const a = document.createElement('a'); a.href = '#'; a.textContent = 'Top'; sectionsDropdown.appendChild(a); }
    { const a = document.createElement('a'); a.href = '#content'; a.textContent = 'Content'; sectionsDropdown.appendChild(a); }
    document.querySelectorAll('main h2').forEach(h2 => {
      if (!h2.id) {
        h2.id = h2.textContent.trim().toLowerCase()
          .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }
      const a = document.createElement('a');
      a.href = '#' + h2.id;
      a.textContent = h2.textContent;
      sectionsDropdown.appendChild(a);
    });
    { const a = document.createElement('a'); a.href = '#page-bottom'; a.textContent = 'Bottom'; sectionsDropdown.appendChild(a); }
    sectionsBtn.addEventListener('click', e => {
      pagesDropdown.classList.remove('open');
      sectionsDropdown.classList.toggle('open');
      e.stopPropagation();
    });
    sectionsDropdown.addEventListener('mouseleave', () => sectionsDropdown.classList.remove('open'));

    const pagesBtn = document.getElementById('pages-btn');
    const pagesDropdown = document.getElementById('pages-dropdown');
    presentationPages.forEach(p => {
      const a = document.createElement('a');
      a.href = p.url;
      a.textContent = p.name;
      pagesDropdown.appendChild(a);
    });
    pagesBtn.addEventListener('click', e => {
      sectionsDropdown.classList.remove('open');
      pagesDropdown.classList.toggle('open');
      e.stopPropagation();
    });
    pagesDropdown.addEventListener('mouseleave', () => pagesDropdown.classList.remove('open'));
    const sectionsWrap = document.getElementById('sections-wrap');
    const pagesWrap = document.getElementById('pages-wrap');
    sectionsWrap.addEventListener('mouseenter', () => {
      pagesDropdown.classList.remove('open');
      sectionsDropdown.classList.add('open');
    });
    sectionsWrap.addEventListener('mouseleave', () => sectionsDropdown.classList.remove('open'));
    pagesWrap.addEventListener('mouseenter', () => {
      sectionsDropdown.classList.remove('open');
      pagesDropdown.classList.add('open');
    });
    pagesWrap.addEventListener('mouseleave', () => pagesDropdown.classList.remove('open'));

    const fsBtn = document.getElementById('fs-btn');
    fsBtn.addEventListener('click', e => {
      e.preventDefault();
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen';
    });
  </script>
</body>
</html>
