<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The End - AI Presentation 2026</title>
  <link rel="stylesheet" href="../Learn/css/reset.css">
  <link rel="stylesheet" href="../Learn/css/ThemeOcean2.css">
  <link rel="stylesheet" href="../css/prism.css">
  <link rel="stylesheet" href="../Learn/css/Learn.css">
  <style>
    html {
      font-size: 26px;   /* page sizes are rem-based: +4px on the 16px root */
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
    }
    main > section:first-child {
      margin-top: 0;
    }
    tm-b {
      display:block;
      margin: 1rem 0rem 0.5rem 0rem;
    }
    tm-b.note {
      border:2px dashed red;
      padding:0.5rem 1.5rem;
      margin: 0.75rem 0rem;
    }
    tm-b ul.tight {
      margin:0rem 1rem;
    }
    tm-b ul.tight li {
      margin:0rem 0.5rem 0.25rem 0.5rem;
    }
    t-b.thanks {
      display: block;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
      color: var(--header-bg);
      margin: 3rem 0rem;
    }
    #top-controls {
      top: 0.25rem;
    }
    #top-controls #prev-btn,
    #top-controls #next-btn {
      display: inline-block;
      background-color: var(--header-bg);
      color: var(--header-clr);
      border: 1px solid var(--header-clr);
      border-radius: 4px;
      font-weight: bold;
      line-height: normal;
      text-decoration: none;
      white-space: nowrap;
    }
    #top-controls #sections-btn,
    #top-controls #pages-btn,
    #top-controls #prev-btn,
    #top-controls #next-btn {
      font-size: 0.7rem;
      padding: 0.25em 0.6em;
    }
    #top-controls {
      gap: 0.6rem;
      align-items: center;
    }
    #top-controls #sections-wrap,
    #top-controls #pages-wrap {
      display: flex;
    }
    #top-controls a.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #lang-bar a {
      font-size: 0.75rem;
    }
    #sections-wrap #sections-dropdown,
    #pages-wrap #pages-dropdown {
      top: 100%;          /* no dead gap: the pointer stays inside the wrap on its way down */
      padding-top: 0.7em;
    }
  </style>
</head>
<body>

<div id="top-controls">
  <div id="sections-wrap">
    <button id="sections-btn" type="button">Sections</button>
    <div id="sections-dropdown"></div>
  </div>
  <div id="pages-wrap">
    <button id="pages-btn" type="button">Pages</button>
    <div id="pages-dropdown"></div>
  </div>
  <a id="prev-btn" href="#" class="disabled">&larr; Prev</a>
  <a id="next-btn" href="#" class="disabled">Next &rarr;</a>
</div>

<header>
  <h1>The End - AI Presentation 2026</h1>
  <t-b>Questions welcome, and the pages stay online</t-b>
</header>

<nav id="lang-bar">
  <div id="lang-links">
    <a href="../Learn/Learn_intro.html">Other Tutorials</a>
    <a href="../Site/Explore.html?src=SiteHome.html">Site Home</a>
  </div>
  <div id="lang-nav">
    <a id="fs-btn" href="#">Full Screen</a>
  </div>
</nav>

<main id="content">

  <section>
    <h2 id="end">The End</h2>
    <t-b class="thanks">
      Thanks for Coming
    </t-b>
  </section>

</main>

<footer id="page-bottom">
  AI Presentation 2026 &nbsp;&bull;&nbsp; The End
</footer>

  <script src="../js/prism.js"></script>
  <script src="PresentationPages.js"></script>
  <script>
    const sectionsBtn = document.getElementById('sections-btn');
    const sectionsDropdown = document.getElementById('sections-dropdown');
    { const a = document.createElement('a'); a.href = '#'; a.textContent = 'Top'; sectionsDropdown.appendChild(a); }
    { const a = document.createElement('a'); a.href = '#content'; a.textContent = 'Content'; sectionsDropdown.appendChild(a); }
    document.querySelectorAll('main h2').forEach(h2 => {
      if (!h2.id) {
        h2.id = h2.textContent.trim().toLowerCase()
          .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }
      const a = document.createElement('a');
      a.href = '#' + h2.id;
      a.textContent = h2.textContent;
      sectionsDropdown.appendChild(a);
    });
    { const a = document.createElement('a'); a.href = '#page-bottom'; a.textContent = 'Bottom'; sectionsDropdown.appendChild(a); }
    sectionsBtn.addEventListener('click', e => {
      pagesDropdown.classList.remove('open');
      sectionsDropdown.classList.toggle('open');
      e.stopPropagation();
    });
    sectionsDropdown.addEventListener('mouseleave', () => sectionsDropdown.classList.remove('open'));

    const pagesBtn = document.getElementById('pages-btn');
    const pagesDropdown = document.getElementById('pages-dropdown');
    presentationPages.forEach(p => {
      const a = document.createElement('a');
      a.href = p.url;
      a.textContent = p.name;
      pagesDropdown.appendChild(a);
    });
    pagesBtn.addEventListener('click', e => {
      sectionsDropdown.classList.remove('open');
      pagesDropdown.classList.toggle('open');
      e.stopPropagation();
    });
    pagesDropdown.addEventListener('mouseleave', () => pagesDropdown.classList.remove('open'));
    const sectionsWrap = document.getElementById('sections-wrap');
    const pagesWrap = document.getElementById('pages-wrap');
    sectionsWrap.addEventListener('mouseenter', () => {
      pagesDropdown.classList.remove('open');
      sectionsDropdown.classList.add('open');
    });
    sectionsWrap.addEventListener('mouseleave', () => sectionsDropdown.classList.remove('open'));
    pagesWrap.addEventListener('mouseenter', () => {
      sectionsDropdown.classList.remove('open');
      pagesDropdown.classList.add('open');
    });
    pagesWrap.addEventListener('mouseleave', () => pagesDropdown.classList.remove('open'));

    const cur = location.href.split('/').pop().split('?')[0];
    const idx = presentationPages.findIndex(p => p.url === cur);
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    if (idx > 0) {
      prevBtn.href = presentationPages[idx-1].url;
      prevBtn.classList.remove('disabled');
    }
    if (idx >= 0 && idx < presentationPages.length - 1) {
      nextBtn.href = presentationPages[idx+1].url;
      nextBtn.classList.remove('disabled');
    }
    [prevBtn, nextBtn].forEach(b => b.addEventListener('click', e => {
      if (b.classList.contains('disabled')) e.preventDefault();
    }));

    const fsBtn = document.getElementById('fs-btn');
    fsBtn.addEventListener('click', e => {
      e.preventDefault();
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen';
    });
  </script>
</body>
</html>
